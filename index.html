<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14283a">
  <title>Indian Packers &amp; Movers Tycoon</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="top" aria-label="Company status"></header>
  <main id="main">
    <section id="map-shell" aria-label="India service network">
      <header class="map-heading">
        <div><p class="eyebrow">India service network</p><h1 id="map-title">Company map</h1><p id="map-subtitle">Select a state to view service coverage.</p></div>
        <div class="map-heading-tools"><span class="map-vintage">Administrative boundaries · 2023</span>
          <div class="map-zoom-controls" role="group" aria-label="Map zoom controls">
            <button type="button" data-map-action="zoom-in" aria-label="Zoom in">+</button>
            <button type="button" data-map-action="zoom-out" aria-label="Zoom out">−</button>
            <button type="button" data-map-action="fit" aria-label="Fit India to view">Fit India</button>
          </div>
        </div>
      </header>
      <div id="map" role="group" aria-label="Selectable map of Indian states and Union Territories">
        <div id="map-stage"></div>
      </div>
      <footer class="map-legend" id="map-legend"></footer>
      <p class="map-credit">Map data © amCharts, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a></p>
    </section>
    <aside id="side" aria-label="Selected section"></aside>
  </main>
  <div id="modal" role="presentation"></div>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map-data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/fleet.js"></script>
  <script src="js/workforce.js"></script>
  <script src="js/marketing.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/save.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/warehouse.js"></script>
  <script src="js/events.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/tycoon-ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
